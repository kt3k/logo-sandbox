<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea 5 — quill</title>
<style>
  :root { --ink:#1c1917; --muted:#64748b; --bg:#fffbeb; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:Georgia,"Times New Roman",serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#b45309; border-color:#b45309; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>Idea 5 · quill — the pen nib</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><path d="M50 6 L80 44 L62 86 L50 95 L38 86 L20 44 Z" fill="var(--a,#1c1917)"/><path d="M50 54 L50 92" stroke="var(--b,#fbbf24)" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="var(--b,#fbbf24)"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word"><i>Quill</i></div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--a:#fafaf9;--b:#f59e0b"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px"><i>Quill</i></div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--a:#fff;--b:#b45309"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>A fountain-pen nib with a serif italic wordmark. A calm, classic feel that fits a docs generator, static-site tool or markdown editor.</p>
</main>
</body>
</html>
