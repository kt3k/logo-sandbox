<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twill — Idea 9</title>
<style>
  :root { --ink:#18181b; --muted:#64748b; --bg:#f7fee7; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:"Inter",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#65a30d; border-color:#65a30d; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>twill · Idea 9 · tw monogram — one continuous thread</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><path d="M22 12 V66 Q22 84 36 84 L46 50 L58 84 L70 50 L82 84 L92 50" fill="none" stroke="var(--a,#18181b)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="10" y1="32" x2="36" y2="32" stroke="var(--b,#65a30d)" stroke-width="9" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">twil<span style="color:#65a30d">l</span></div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--a:#fafafa;--b:#a3e635"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">twil<span style="color:#65a30d">l</span></div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--a:#fff;--b:#1a2e05"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>A "tw" monogram drawn as a single continuous line, like one thread: the tail of the t runs straight into the zigzag of the w. Only the t's crossbar is in the accent color, and the final l of the wordmark matches it.</p>
</main>
</body>
</html>
