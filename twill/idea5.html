<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twill — Idea 5</title>
<style>
  :root { --ink:#064e3b; --muted:#64748b; --bg:#ecfdf5; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:"Poppins",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#059669; border-color:#059669; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>twill · Idea 5 · spool — a spool of classes</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><clipPath id="core"><rect x="28" y="20" width="44" height="60"/></clipPath><rect x="28" y="20" width="44" height="60" fill="var(--a,#059669)"/><g clip-path="url(#core)" stroke="var(--b,#6ee7b7)" stroke-width="3"><line x1="0" y1="20" x2="-60" y2="80"/><line x1="9" y1="20" x2="-51" y2="80"/><line x1="18" y1="20" x2="-42" y2="80"/><line x1="27" y1="20" x2="-33" y2="80"/><line x1="36" y1="20" x2="-24" y2="80"/><line x1="45" y1="20" x2="-15" y2="80"/><line x1="54" y1="20" x2="-6" y2="80"/><line x1="63" y1="20" x2="3" y2="80"/><line x1="72" y1="20" x2="12" y2="80"/><line x1="81" y1="20" x2="21" y2="80"/><line x1="90" y1="20" x2="30" y2="80"/><line x1="99" y1="20" x2="39" y2="80"/><line x1="108" y1="20" x2="48" y2="80"/><line x1="117" y1="20" x2="57" y2="80"/><line x1="126" y1="20" x2="66" y2="80"/><line x1="135" y1="20" x2="75" y2="80"/><line x1="144" y1="20" x2="84" y2="80"/><line x1="153" y1="20" x2="93" y2="80"/></g><rect x="16" y="8" width="68" height="14" rx="7" fill="var(--c,#064e3b)"/><rect x="16" y="78" width="68" height="14" rx="7" fill="var(--c,#064e3b)"/><path d="M72 62 C88 62 86 82 96 94" fill="none" stroke="var(--a,#059669)" stroke-width="4" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">twill</div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--c:#d1fae5;--a:#10b981;--b:#064e3b"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">twill</div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--a:#fff;--b:#6ee7b7;--c:#064e3b"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>A spool with thread wound diagonally and one end hanging loose. The metaphor is atomic CSS generating only the classes you use: you pull out only as much thread as you need.</p>
</main>
</body>
</html>
