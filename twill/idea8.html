<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twill — Idea 8</title>
<style>
  :root { --ink:#2e1065; --muted:#64748b; --bg:#f5f3ff; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:"Poppins",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#5b21b6; border-color:#5b21b6; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>twill · Idea 8 · atom steps — cubes on a diagonal</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><path d="M78 10 L96 19.0 L78 28 L60 19.0 Z" fill="var(--a,#ddd6fe)"/><path d="M60 19.0 L78 28 L78 46 L60 37.0 Z" fill="var(--b,#8b5cf6)"/><path d="M78 28 L96 19.0 L96 37.0 L78 46 Z" fill="var(--c,#5b21b6)"/><path d="M50 32 L68 41.0 L50 50 L32 41.0 Z" fill="var(--a,#ddd6fe)"/><path d="M32 41.0 L50 50 L50 68 L32 59.0 Z" fill="var(--b,#8b5cf6)"/><path d="M50 50 L68 41.0 L68 59.0 L50 68 Z" fill="var(--c,#5b21b6)"/><path d="M22 54 L40 63.0 L22 72 L4 63.0 Z" fill="var(--a,#ddd6fe)"/><path d="M4 63.0 L22 72 L22 90 L4 81.0 Z" fill="var(--b,#8b5cf6)"/><path d="M22 72 L40 63.0 L40 81.0 L22 90 Z" fill="var(--c,#5b21b6)"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">twill</div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style=""><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">twill</div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--a:#fff;--b:rgba(255,255,255,.7);--c:rgba(255,255,255,.45)"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>Three identical isometric cubes (atoms) stepping up along a diagonal. The diagonal echoes the ridges of twill, and the repeated blocks stand for small single-purpose classes building up into a layout.</p>
</main>
</body>
</html>
