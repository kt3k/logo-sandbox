<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twill — Idea 10</title>
<style>
  :root { --ink:#172554; --muted:#64748b; --bg:#eff6ff; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:ui-monospace,"JetBrains Mono",Menlo,monospace; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#f59e0b; border-color:#f59e0b; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>twill · Idea 10 · denim — a twill fabric swatch</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><clipPath id="sw"><path d="M10 10 H66 L90 34 V90 H10 Z"/></clipPath><path d="M10 10 H66 L90 34 V90 H10 Z" fill="var(--a,#1e3a8a)"/><g clip-path="url(#sw)" stroke="var(--b,#3355b0)" stroke-width="2.5"><line x1="0" y1="0" x2="-100" y2="100"/><line x1="7" y1="0" x2="-93" y2="100"/><line x1="14" y1="0" x2="-86" y2="100"/><line x1="21" y1="0" x2="-79" y2="100"/><line x1="28" y1="0" x2="-72" y2="100"/><line x1="35" y1="0" x2="-65" y2="100"/><line x1="42" y1="0" x2="-58" y2="100"/><line x1="49" y1="0" x2="-51" y2="100"/><line x1="56" y1="0" x2="-44" y2="100"/><line x1="63" y1="0" x2="-37" y2="100"/><line x1="70" y1="0" x2="-30" y2="100"/><line x1="77" y1="0" x2="-23" y2="100"/><line x1="84" y1="0" x2="-16" y2="100"/><line x1="91" y1="0" x2="-9" y2="100"/><line x1="98" y1="0" x2="-2" y2="100"/><line x1="105" y1="0" x2="5" y2="100"/><line x1="112" y1="0" x2="12" y2="100"/><line x1="119" y1="0" x2="19" y2="100"/><line x1="126" y1="0" x2="26" y2="100"/><line x1="133" y1="0" x2="33" y2="100"/><line x1="140" y1="0" x2="40" y2="100"/><line x1="147" y1="0" x2="47" y2="100"/><line x1="154" y1="0" x2="54" y2="100"/><line x1="161" y1="0" x2="61" y2="100"/><line x1="168" y1="0" x2="68" y2="100"/><line x1="175" y1="0" x2="75" y2="100"/><line x1="182" y1="0" x2="82" y2="100"/><line x1="189" y1="0" x2="89" y2="100"/><line x1="196" y1="0" x2="96" y2="100"/></g><path d="M17 17 H63 L83 37 V83 H17 Z" fill="none" stroke="var(--s,#f59e0b)" stroke-width="3" stroke-dasharray="6 4" stroke-linejoin="round"/><path d="M66 10 V34 H90 Z" fill="var(--c,#93c5fd)"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">twill</div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--c:#bfdbfe"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">twill</div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--a:#fff;--b:#fde68a;--s:#1e3a8a;--c:#fcd34d"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>Denim is the best-known twill fabric. This is a denim swatch with fine diagonal lines, orange stitching like on jeans, and a folded corner. A sturdy, everyday look: "a tool you can wear every day".</p>
</main>
</body>
</html>
