<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea 10 — bloom</title>
<style>
  :root { --ink:#3b0764; --muted:#64748b; --bg:#fdf4ff; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:"Poppins",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#fdf2f8; border-color:#fdf2f8; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>Idea 10 · bloom — six petals</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><circle cx="50.00" cy="28.00" r="22" fill="#f472b6" opacity=".78"/><circle cx="69.05" cy="39.00" r="22" fill="#fb923c" opacity=".78"/><circle cx="69.05" cy="61.00" r="22" fill="#facc15" opacity=".78"/><circle cx="50.00" cy="72.00" r="22" fill="#4ade80" opacity=".78"/><circle cx="30.95" cy="61.00" r="22" fill="#38bdf8" opacity=".78"/><circle cx="30.95" cy="39.00" r="22" fill="#a78bfa" opacity=".78"/><circle cx="50" cy="50" r="9" fill="var(--c,#fff)"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">bloom</div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--c:#13111c"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">bloom</div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style=""><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>Six semi-transparent petals that overlap: "many plugins blending together". Colorful and soft; suits a design-token, theme or plugin-ecosystem project.</p>
</main>
</body>
</html>
