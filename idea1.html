<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea 1 — tern</title>
<style>
  :root { --ink:#18181b; --muted:#71717a; --bg:#fafaf9; --card:#fff; --line:#e7e5e4; --accent:#f97316; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-family:system-ui,sans-serif; font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap; }
  .word { font-size:60px; font-weight:700; letter-spacing:-.03em; }
  .word .cur { display:inline-block; width:.5em; height:.12em; background:var(--accent); margin-left:.06em; vertical-align:baseline; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#18181b; color:#fafaf9; border-color:#18181b; }
  .brand { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sizes { background:var(--card); }
  p { font-family:system-ui,sans-serif; color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>Idea 1 · tern — terminal bird</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- A bird (tern) whose wings form a ">" prompt, with an underscore cursor -->
      <symbol id="mark" viewBox="0 0 100 100">
        <rect x="4" y="4" width="92" height="92" rx="24" fill="#18181b"/>
        <path d="M24 30 L50 50 L24 70" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 50 L78 34" fill="none" stroke="#fafaf9" stroke-width="10" stroke-linecap="round"/>
        <rect x="56" y="64" width="22" height="9" rx="4.5" fill="#fafaf9"/>
      </symbol>
      <symbol id="mark-flat" viewBox="0 0 100 100">
        <path d="M24 30 L50 50 L24 70" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 50 L78 34" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
        <rect x="56" y="64" width="22" height="9" rx="4.5" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="112" height="112"><use href="#mark"/></svg>
    <div class="word">tern<span class="cur"></span></div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="64" height="64" style="color:#f97316"><use href="#mark-flat"/></svg>
      <div class="word" style="font-size:30px">tern</div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="color:#fff"><use href="#mark-flat"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>A shell prompt <code>&gt;</code> that doubles as a bird in flight, plus a blinking cursor. Aimed at a CLI tool or terminal-first dev tool. Monospace wordmark, orange accent.</p>
</main>
</body>
</html>
