<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea 8 — graphite</title>
<style>
  :root { --ink:#1a2e05; --muted:#64748b; --bg:#f7fee7; --card:#fff; --line:rgba(0,0,0,.08); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-family:"Inter",system-ui,sans-serif; font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b0f19; color:#f8fafc; border-color:#0b0f19; }
  .brand { background:#1a2e05; border-color:#1a2e05; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>Idea 8 · graphite — nodes &amp; edges</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      
      <symbol id="mark" viewBox="0 0 100 100"><g stroke="var(--e,#334155)" stroke-width="6" stroke-linecap="round"><path d="M50 18 L20 74 L80 74 Z" fill="none"/><path d="M50 18 L50 54 M20 74 L50 54 M80 74 L50 54"/></g><circle cx="50" cy="18" r="11" fill="var(--a,#84cc16)"/><circle cx="20" cy="74" r="11" fill="var(--a,#84cc16)"/><circle cx="80" cy="74" r="11" fill="var(--a,#84cc16)"/><circle cx="50" cy="54" r="13" fill="var(--c,#0f172a)"/></symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">graph<span style="color:#65a30d">ite</span></div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56" style="--e:#94a3b8;--c:#f8fafc"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">graph<span style="color:#65a30d">ite</span></div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88" style="--e:rgba(255,255,255,.55);--a:#bef264;--c:#fff"><use href="#mark"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>Three nodes with a hub in the middle: a graph (network) drawn as simply as possible. Aimed at a graph DB, dependency analysis or workflow engine.</p>
</main>
</body>
</html>
