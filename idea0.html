<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea 0 — hexkit</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 24px; }
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:64px 24px; display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .word { font-size:64px; font-weight:800; letter-spacing:-.04em; }
  .word span { color:#10b981; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:16px; }
  .tile { border-radius:16px; padding:32px; display:flex; align-items:center; justify-content:center; gap:12px; min-height:160px; border:1px solid var(--line); }
  .dark { background:#0b1220; color:#f1f5f9; border-color:#0b1220; }
  .dark .word span { color:#34d399; }
  .brand { background:#10b981; border-color:#10b981; }
  .sizes { background:var(--card); }
  p { color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<main>
  <h1>Idea 0 · hexkit — modular hexagon</h1>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/>
      </linearGradient>
      <symbol id="mark" viewBox="0 0 100 100">
        <!-- outer hexagon -->
        <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" fill="url(#g0)"/>
        <!-- inner cube faces -->
        <path d="M50 26 L71 38 L50 50 L29 38 Z" fill="#fff" opacity=".95"/>
        <path d="M29 38 L50 50 L50 74 L29 62 Z" fill="#fff" opacity=".6"/>
        <path d="M71 38 L50 50 L50 74 L71 62 Z" fill="#fff" opacity=".35"/>
      </symbol>
      <symbol id="mark-mono" viewBox="0 0 100 100">
        <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" fill="#fff"/>
        <path d="M50 26 L71 38 L50 50 L29 38 Z" fill="#10b981"/>
        <path d="M29 38 L50 50 L50 74 L29 62 Z" fill="#10b981" opacity=".7"/>
        <path d="M71 38 L50 50 L50 74 L71 62 Z" fill="#10b981" opacity=".45"/>
      </symbol>
    </defs>
  </svg>

  <section class="hero">
    <svg width="120" height="120"><use href="#mark"/></svg>
    <div class="word">hex<span>kit</span></div>
  </section>

  <div class="grid">
    <div class="tile dark">
      <svg width="56" height="56"><use href="#mark"/></svg>
      <div class="word" style="font-size:32px">hex<span>kit</span></div>
    </div>
    <div class="tile brand">
      <svg width="88" height="88"><use href="#mark-mono"/></svg>
    </div>
    <div class="tile sizes">
      <svg width="64" height="64"><use href="#mark"/></svg>
      <svg width="32" height="32"><use href="#mark"/></svg>
      <svg width="16" height="16"><use href="#mark"/></svg>
    </div>
  </div>

  <p>A cube inside a hexagon: "modules that snap together". Works for a package manager, build tool or plugin system. Reads cleanly down to 16px as a favicon.</p>
</main>
</body>
</html>
